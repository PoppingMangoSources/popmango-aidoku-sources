name: Build source list
on:
  push:
    branches:
      - main
    paths:
      - "sources/**"
      - "templates/**"
      - "public/**"
      - ".github/actions/install-aidoku-cli/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate before packaging
        run: python3 scripts/ci-gates.py --event

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache rust stuff
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sources/**/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: ./.github/actions/install-aidoku-cli

      - name: Lint changed sources before packaging
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="origin/main"
          fi
          python3 scripts/changed-crates.py --base "$base" | bash scripts/lint-crates.sh

      - name: Build sources
        run: |
          set -euo pipefail

          for source in sources/*; do
            [[ -f "$source/Cargo.toml" ]] || continue

            echo "::group::Packaging $source"
            (
              cd "$source"
              aidoku package
            )
            echo "::endgroup::"
          done

      - name: Build source list
        run: |
          aidoku build sources/*/package.aix --name "PoppingMango Sources"

      # Phones keep the old stylesheet and script cached after a deploy, so the page would mix
      # new markup with old code. Each deploy asks for its own copies.
      - name: Version the install page assets
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" public/index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          branch: gh-pages
          folder: public
          git-config-name: GitHub Actions
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: Update source list
          single-commit: true

      - name: Uploading packages as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: public/sources/*.aix
          if-no-files-found: ignore

      - name: Upload source list for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-list
          path: public
          if-no-files-found: ignore
