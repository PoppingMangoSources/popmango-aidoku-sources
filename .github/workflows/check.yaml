name: Check source rules

# The AGENTS.md / CLAUDE.md rules that need no network or toolchain, as `check-sources.py` implements
# them (AGENTS.md / CLAUDE.md section 9 lists them). Only the sources a change touches are checked; the
# checker's own tests and an upstream calibration run on every push.

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed sources
        # Read from the environment: a ref name on a fork's pull request is attacker-chosen.
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            base="$BEFORE"
          else
            base="HEAD~1"
          fi
          python3 scripts/check-sources.py --base "$base"
      - name: Exercise workflow guard regressions
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Calibrate rules against upstream
        # A rule that fails code upstream merged needs evidence it is still the reviewer's
        # position. Reported in the summary; not a gate.
        run: |
          {
            echo "### Rule failures across merged upstream sources"
            echo '```'
            scripts/calibrate-rules.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker://rhysd/actionlint:1.7.7
