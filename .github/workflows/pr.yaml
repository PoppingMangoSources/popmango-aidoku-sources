name: Check PR
# Upstream's checks, run on pushes to main as well, since main is where this repo publishes.
on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
    paths:
      - "sources/**"
      - "templates/**"
      - ".github/actions/install-aidoku-cli/**"
      - ".github/workflows/pr.yaml"
      - "scripts/**"
  pull_request:
    paths:
      - "sources/**"
      - "templates/**"
      - ".github/actions/install-aidoku-cli/**"
      - ".github/workflows/pr.yaml"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  verify-sources:
    name: Verify sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown

      - name: Cache rust stuff
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sources/**/target
            templates/**/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: ./.github/actions/install-aidoku-cli

      - name: Build and verify changed source packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git merge-base HEAD origin/main); fi
          mkdir -p "$RUNNER_TEMP/source-packages"
          python3 scripts/changed-crates.py --base "$base" --sources-only > "$RUNNER_TEMP/changed-sources"
          while IFS= read -r source; do
            echo "::group::Packaging $source"
            (cd "$source"; aidoku package; test -s package.aix; aidoku verify package.aix)
            cp "$source/package.aix" "$RUNNER_TEMP/source-packages/$(basename "$source").aix"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/changed-sources"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: ${{ runner.temp }}/source-packages/*.aix
          if-no-files-found: ignore

  json-format:
    name: JSON formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check JSON format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          failed=0

          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git merge-base HEAD origin/main); fi
          python3 scripts/changed-crates.py --base "$base" --sources-only > "$RUNNER_TEMP/changed-sources"
          readarray -t sources < "$RUNNER_TEMP/changed-sources"

          for source in "${sources[@]}"; do
            [[ -d "$source/res" ]] || continue

            echo "::group::Checking JSON in $source/res"

            while IFS= read -r -d '' file; do
              if [[ -s "$file" && -n "$(tail -c 1 "$file")" ]]; then
                line="$(awk 'END { print NR }' "$file")"
                echo "::error file=$file,line=$line,title=Missing final newline::JSON files must end with a newline."
                failed=1
              fi

              while IFS=: read -r line _; do
                echo "::error file=$file,line=$line,title=Invalid JSON indentation::Use tabs for indentation; do not use spaces."
                failed=1
              done < <(grep -nE $'^\t* +' "$file" || true)
            done < <(find "$source/res" -type f -name '*.json' -print0)

            echo "::endgroup::"
          done

          if (( failed )); then
            exit 1
          fi
